<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chaverim Bergen County — Emergency Dispatch</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F2ECD8;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: #0F0E06;
    border-bottom: 2.5px solid #C8A532;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo-badge { width: 58px; height: 58px; border-radius: 12px; overflow: hidden; flex-shrink: 0; border: 2px solid #C8A532; }
  .logo-badge img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .brand-name { font-size: 22px; font-weight: 600; color: #C8A532; line-height: 1.1; letter-spacing: 0.3px; }
  .brand-sub { font-size: 10px; color: #C8A532; letter-spacing: 2.5px; text-transform: uppercase; opacity: 0.6; margin-top: 2px; }
  .brand-tag { font-size: 11px; color: #7A6830; margin-top: 3px; }

  /* ── Page body ── */
  .page {
    max-width: 680px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 3rem;
  }

  /* ── Section label ── */
  .section-row { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #C8A532; }
  .section-lbl { font-size: 10px; font-weight: 600; color: #8B6E1A; letter-spacing: 2px; text-transform: uppercase; }

  /* ── Card ── */
  .form-card {
    background: #fff;
    border-radius: 18px;
    border: 1px solid #DDD09A;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(180,140,20,0.10);
  }

  .card-hdr {
    background: #0F0E06;
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #221E08;
  }
  .card-ttl {
    color: #C8A532;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-ttl i { font-size: 18px; }

  .clear-btn {
    background: transparent;
    border: 1px solid #2E2C12;
    border-radius: 8px;
    padding: 5px 14px;
    color: #7A6830;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
  }
  .clear-btn:hover { border-color: #C8A532; color: #C8A532; }

  /* ── Form body ── */
  .card-body { padding: 1.4rem 1.4rem 1.25rem; background: #FDFBF0; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 1.1rem; }

  .field { margin-bottom: 1.1rem; }
  .field:last-child { margin-bottom: 0; }

  .lbl {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: #6B5515;
    margin-bottom: 6px;
    letter-spacing: 0.2px;
  }
  .lbl i { font-size: 14px; color: #C8A532; }
  .req { color: #C8A532; }

  input[type=text], input[type=tel], textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #E0CC80;
    border-radius: 10px;
    font-size: 14px;
    background: #FFFEF5;
    color: #1A1400;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #C8A532;
    box-shadow: 0 0 0 3px rgba(200,165,50,0.16);
    background: #FFFFFF;
  }
  input::placeholder, textarea::placeholder { color: #C0A860; opacity: 0.7; }
  textarea { resize: vertical; min-height: 90px; line-height: 1.55; }

  .loc-wrap { position: relative; }
  .loc-wrap input { padding-right: 72px; }
  .map-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: #0F0E06;
    border: none;
    border-radius: 7px;
    padding: 6px 10px;
    color: #C8A532;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
    font-weight: 600;
  }
  .map-btn:hover { background: #1E1C08; }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: #E5D488;
    margin: 1.1rem 0;
    opacity: 0.6;
  }

  /* ── Action buttons ── */
  .actions { display: flex; flex-direction: column; gap: 10px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 15px 20px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    width: 100%;
    font-family: inherit;
    letter-spacing: 0.2px;
    transition: all 0.15s;
  }
  .btn i { font-size: 19px; }
  .btn:active { transform: scale(0.98); }

  .btn-wa { background: #C8A532; color: #0F0E06; }
  .btn-wa:hover { background: #D8B540; }

  .btn-int { background: #0F0E06; color: #C8A532; border: 1.5px solid #2E2A10; }
  .btn-int:hover { background: #1C1A08; }

  /* ── Preview panel ── */
  .preview {
    background: #0F0E06;
    border-radius: 14px;
    padding: 1.1rem 1.25rem;
    margin-top: 1.1rem;
    display: none;
    border: 1px solid #2A2810;
  }
  .preview.on { display: block; }
  .preview-lbl {
    font-size: 10px;
    color: #6A5A20;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }
  .preview-lbl::after { content: ''; flex: 1; height: 1px; background: #2A2810; }
  .preview-txt {
    font-size: 12.5px;
    color: #E8D98A;
    font-family: 'SF Mono', 'Fira Code', monospace;
    white-space: pre-wrap;
    line-height: 1.7;
  }

  /* ── Responsive ── */
  @media (max-width: 520px) {
    .page { padding: 1rem 0.75rem 2rem; }
    .grid2 { grid-template-columns: 1fr; gap: 0; }
    .grid2 > div:first-child { margin-bottom: 1.1rem; }
    .header { padding: 0.9rem 1rem; }
    .logo-badge { width: 48px; height: 48px; }
    .brand-name { font-size: 19px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo-badge"><img src="https://i.ibb.co/Kc2B52nS/download-1.png" alt="Chaverim Bergen County logo" /></div>
  <div>
    <div class="brand-name">Chaverim</div>
    <div class="brand-sub">Bergen County</div>
    <div class="brand-tag">Emergency Response Dispatch</div>
  </div>
</div>

<div class="page">
  <div class="section-row">
    <div class="dot"></div>
    <div class="section-lbl">New call</div>
  </div>

  <div class="form-card">
    <div class="card-hdr">
      <div class="card-ttl">
        <i class="ti ti-alert-triangle"></i>
        Emergency Dispatch Form
      </div>
      <button class="clear-btn" onclick="clearForm()">
        <i class="ti ti-refresh" style="font-size:13px;"></i> Clear Call
      </button>
    </div>

    <div class="card-body">
      <div class="grid2">
        <div>
          <div class="lbl"><i class="ti ti-hash"></i> Call # <span class="req">*</span></div>
          <input type="text" id="callNum" placeholder="Enter call number" />
        </div>
        <div>
          <div class="lbl"><i class="ti ti-phone"></i> Phone</div>
          <input type="tel" id="phone" placeholder="(555) 123-4567" />
        </div>
      </div>

      <div class="field">
        <div class="lbl"><i class="ti ti-map-pin"></i> Location <span class="req">*</span></div>
        <div class="loc-wrap">
          <input type="text" id="location" placeholder="123 Main St, Edison, NJ" />
          <button class="map-btn" onclick="verifyLocation()">
            <i class="ti ti-map-pin" style="font-size:12px;"></i> Map
          </button>
        </div>
      </div>

      <div class="field">
        <div class="lbl"><i class="ti ti-user"></i> Caller name</div>
        <input type="text" id="callerName" placeholder="John Doe" />
      </div>

      <div class="field">
        <div class="lbl"><i class="ti ti-file-description"></i> Nature of emergency <span class="req">*</span></div>
        <textarea id="nature" placeholder="Flat tire, lockout, jump start, Genesis GV80, etc."></textarea>
      </div>

      <div class="divider"></div>

      <div class="actions">
        <button class="btn btn-wa" onclick="dispatchWhatsApp()">
          <i class="ti ti-message-circle"></i> Dispatch via WhatsApp
        </button>
        <button class="btn btn-int" onclick="dispatchInterstate()">
          <i class="ti ti-car"></i> Dispatch to Interstate
        </button>
      </div>
    </div>
  </div>

  <div class="preview" id="preview">
    <div class="preview-lbl">Message preview</div>
    <div class="preview-txt" id="previewText"></div>
  </div>
</div>

<script>
function getFormData() {
  return {
    callNum: document.getElementById('callNum').value,
    phone: document.getElementById('phone').value,
    location: document.getElementById('location').value,
    name: document.getElementById('callerName').value,
    nature: document.getElementById('nature').value
  };
}

function buildWA(d) {
  return [
    'Call#:' + d.callNum,
    'Location:' + d.location,
    'Phone:' + d.phone,
    'Name:' + d.name,
    'Nature:' + d.nature,
    '',
    'https://form.jotform.com/212776438913868',
    'SAFETY FIRST!  Please remember to wear your Chaverim vest.',
    'Please remember to have the caller sign the waiver.'
  ].join('\n');
}

function buildInt(d) {
  return [
    'New Call (BC)',
    'Location: ' + d.location,
    'Phone: ' + d.phone,
    'Name: ' + d.name,
    'Nature: ' + d.nature
  ].join('\n');
}

function showPreview(txt) {
  document.getElementById('previewText').textContent = txt;
  document.getElementById('preview').classList.add('on');
}

function dispatchWhatsApp() {
  var d = getFormData();
  if (!d.callNum || !d.location || !d.nature) {
    alert('Please fill in Call #, Location, and Nature of Emergency.');
    return;
  }
  var msg = buildWA(d);
  showPreview(msg);
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

function dispatchInterstate() {
  var d = getFormData();
  if (!d.location || !d.nature) {
    alert('Please fill in Location and Nature of Emergency.');
    return;
  }
  var msg = buildInt(d);
  showPreview(msg);
  window.open('https://wa.me/18458524357?text=' + encodeURIComponent(msg), '_blank');
}

function verifyLocation() {
  var loc = document.getElementById('location').value;
  if (loc) window.open('https://maps.google.com/?q=' + encodeURIComponent(loc), '_blank');
}

function clearForm() {
  ['callNum', 'phone', 'location', 'callerName', 'nature'].forEach(function(id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('preview').classList.remove('on');
}
</script>
</body>
</html>
